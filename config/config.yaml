##############################################
# ClusterGuide configuration
##############################################

# ------------------------------------------------------------------
# Input databases
#
# These should already have been generated by a user-modified version
# of ortho_results_parser.py.
# ------------------------------------------------------------------

parsed_databases:
  - data/CD-HIT_Pa_90_200k_parsed.txt
  - data/MMseqs2_Pa_90_200k_parsed.txt
  - data/Diamond_Pa_90_200k_parsed.txt
  - data/USEARCH_Pa_90_200k_parsed.txt

parsed_json_databases:
  - data/CD-HIT_Pa_90_200k_parsed.json
  - data/MMseqs2_Pa_90_200k_parsed.json
  - data/Diamond_Pa_90_200k_parsed.json
  - data/USEARCH_Pa_90_200k_parsed.json

# ------------------------------------------------------------------
# Dataset information
# ------------------------------------------------------------------

dataset_id: Size_200k

# Remove everything before this substring when producing plots
removable_string: Pa

# Use "NA" to perform all-against-all Anderson-Darling comparisons
column_substring: NA

# ------------------------------------------------------------------
# Output locations
# ------------------------------------------------------------------

combined_database: results/Orthology_Comparison_DB.txt

summary_stats_basename: results/statistics/summary
summary_stats_output: results/statistics/summary__og_stats.txt

cluster_counts_output: results/statistics/Ortho_Comparison_CountsClean.txt

desc_stats_plot: results/statistics/summary__Visualized.pdf

significance_output: results/statistics/Ortho_Comparison_CountsClean__AndersonDarling.txt

# ------------------------------------------------------------------
# Membership overlap analysis
# ------------------------------------------------------------------

membership_identifier: 90

# Membership overlap threshold percentage
membership_percent: 50

# Output basename
membership_output_basename: Pa_90_200k

# Intermediate JSON produced by og_membership_test.py
membership_json: results/overlap/og_score_dict_90.json

# Final overlap score output
membership_output: results/overlap/Pa_90_200k__50.txt

# ------------------------------------------------------------------
# Membership overlap run mode
#
# Choose exactly one:
#
#   run_all: true
#       Run the complete analysis using -a.
#
#   run_all: false
#       Resume from a checkpoint using -c and -j.
# ------------------------------------------------------------------

membership_run_all: true

# Checkpoint number to resume from.
# Valid values are 2, 3, 4, or 5.
# Ignored when membership_run_all is true.
membership_checkpoint: 2

# JSON file produced at the previous checkpoint.
# Required when membership_run_all is false.
membership_checkpoint_json: ""

# Names of the four clustering programs.
membership_program_names:
  - CD-HIT
  - MMseqs2
  - Diamond
  - USEARCH

# Final heatmap
membership_plot: results/figures/cluster_overlap__Visualized.pdf

# ------------------------------------------------------------------
# Notifications
# ------------------------------------------------------------------

user_email: NO_EMAIL
