##############################################
# ClusterGuide configuration
##############################################

# ------------------------------------------------------------------
# Input databases
#
# These should already have been generated by a user-modified version
# of ortho_results_parser.py.
# ------------------------------------------------------------------

parsed_databases:
  - data/CDHIT_parsed.txt
  - data/MMseqs2_parsed.txt
  - data/Diamond_parsed.txt
  - data/USEARCH_parsed.txt


# ------------------------------------------------------------------
# Dataset information
# ------------------------------------------------------------------

dataset_id: Human_Gut

# Remove everything before this substring when producing plots
removable_string: HumanGut

column_substring: ""


# ------------------------------------------------------------------
# Output locations
# ------------------------------------------------------------------

combined_database: results/orthology_database.pkl

summary_stats_basename: results/statistics/summary
summary_stats_output: results/statistics/summary_stats.tsv

cluster_counts_output: results/statistics/cluster_counts.tsv

desc_stats_plot: results/figures/descriptive_statistics.pdf

significance_output: results/statistics/anderson_darling.tsv


# ------------------------------------------------------------------
# Membership overlap analysis
# ------------------------------------------------------------------

membership_identifier: HumanGut

membership_percent: 0.5

membership_outbase: results/overlap/overlap_scores

membership_json: results/overlap/og_score_dict_HumanGut.json

membership_plot_basename: results/figures/cluster_overlap

membership_plot: results/figures/cluster_overlap.pdf


# ------------------------------------------------------------------
# Notifications
# ------------------------------------------------------------------

user_email: NO_EMAIL
